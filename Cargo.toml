[workspace]
members = ["cortex-core", "cortex-mcp-server", "cortex-http", "cortex-cloud", "cortex-python", "cortex-wasm"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep native wheel symbols: stripping this cdylib can produce a misaligned
# LINKEDIT string table with current macOS linker/install-name tooling.
[profile.release.package.cortex-python]
strip = false
