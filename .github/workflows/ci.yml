name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --exclude cortex-python --exclude cortex-wasm

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --exclude cortex-python --exclude cortex-wasm -- -D warnings

  privacy:
    name: Privacy (no network egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert cortex-core default build has no network/telemetry deps
        run: bash scripts/check-no-network-egress.sh

  controlled-wheel:
    name: Controlled wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Build native wheel
        run: |
          python -m pip install 'maturin>=1.0,<2.0'
          maturin build --release -m cortex-python/Cargo.toml --out dist --interpreter python
      - name: Install wheel and run isolated acceptance
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I "$GITHUB_WORKSPACE/cortex-python/tests/test_controlled_store.py"
      - name: Reject writable foreign-owned database (real filesystem)
        if: runner.os == 'Linux'
        run: |
          fixture_dir=$(mktemp -d)
          chmod 755 "$fixture_dir"
          fixture_path="$fixture_dir/foreign.db"
          touch "$fixture_path"
          sudo chown 65534:65534 "$fixture_path"
          sudo chmod 666 "$fixture_path"
          CORTEX_FOREIGN_OWNED_DB="$fixture_path" python -I "$GITHUB_WORKSPACE/cortex-python/tests/test_foreign_owned_database.py"
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 14

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: |
          cargo bench --package cortex-core --bench comparison_bench 2>&1 | tee bench-output.txt
          cargo bench --package cortex-core --bench memory_index_bench 2>&1 | tee -a bench-output.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90
